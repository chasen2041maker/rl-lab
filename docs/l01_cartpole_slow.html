<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>倒立摆慢放</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 布局：单列。上：小车 + 杆 + 角度表盘；中：读数；下：角度随时间的曲线 */
:root {
  --bg: #f3f5f4; --panel: #ffffff; --fg: #1b2420; --muted: #5f6d67; --line: #d3dbd7;
  --accent: #127a6c; --accent-soft: #d5ece8; --push: #2b63c6; --over: #d9822b; --over-soft: #fbead6;
  --danger: #c8443b; --danger-soft: #f7dcd9; --track: #c9d2ce; --cart: #34433d; --pole: #8a5a2b;
  --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111816; --panel: #19221f; --fg: #e2eae6; --muted: #92a39c; --line: #2b3833;
  --accent: #4cc2b0; --accent-soft: #1b3a35; --push: #78a6f5; --over: #f0a457; --over-soft: #3d2a17;
  --danger: #ef7268; --danger-soft: #3d1f1d; --track: #3a4842; --cart: #b8c7c0; --pole: #d4a06a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111816; --panel: #19221f; --fg: #e2eae6; --muted: #92a39c; --line: #2b3833;
  --accent: #4cc2b0; --accent-soft: #1b3a35; --push: #78a6f5; --over: #f0a457; --over-soft: #3d2a17;
  --danger: #ef7268; --danger-soft: #3d1f1d; --track: #3a4842; --cart: #b8c7c0; --pole: #d4a06a; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px }
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px }
h1 { font-size: 22px; margin: 0; text-wrap: balance }
.sub { color: var(--muted); margin: 0 }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.row .lab { font-size: 13px; color: var(--muted); margin-right: 2px }
button { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer }
button.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 500 }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
input[type=range] { flex: 1; min-width: 140px; accent-color: var(--accent) }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums }
canvas { width: 100%; display: block; border-radius: 8px; background: var(--bg) }
#scene { height: 300px }
#chart { height: 200px }
.read { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px }
.cell { background: var(--bg); border-radius: 8px; padding: 8px 10px; min-width: 0 }
.cell .k { font-size: 12px; color: var(--muted) }
.cell .v { font-family: var(--mono); font-size: 15px; font-weight: 600 }
.say { border-radius: 8px; padding: 10px 12px; background: var(--accent-soft); min-height: 3.2em }
.say.over { background: var(--over-soft) }
.say.end { background: var(--danger-soft) }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted) }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin-right: 4px }
.take { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; margin: 0 }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto } }
</style>
</head>
<body>
<div class="wrap">
  <h1>倒立摆慢放</h1>
  <p class="sub">第 1 课 · 种子 0–2 的前 3 回合，和 <span class="mono">--show</span> 窗口里是同样的 3 回合。真实每一步只有 0.02 秒，这里放慢了看。</p>

  <section class="panel">
    <div class="row"><span class="lab">谁在推</span>
      <button id="p-angle" class="on">你的规则：往歪的方向推</button>
      <button id="p-random">随机乱推</button>
    </div>
    <div class="row"><span class="lab">第几回合</span>
      <button class="ep on" data-ep="0">1</button><button class="ep" data-ep="1">2</button><button class="ep" data-ep="2">3</button>
      <span class="lab" style="margin-left:8px">速度</span>
      <button class="sp" data-sp="0.05">0.05×</button><button class="sp on" data-sp="0.1">0.1×</button><button class="sp" data-sp="0.25">0.25×</button><button class="sp" data-sp="1">1×（真实）</button>
    </div>
    <canvas id="scene"></canvas>
    <div class="row">
      <button id="play">播放</button>
      <button id="prev">◀ 上一步</button>
      <button id="next">下一步 ▶</button>
      <input type="range" id="slider" min="0" max="10" value="0" aria-label="第几步">
    </div>
    <div class="read">
      <div class="cell"><div class="k">第几步</div><div class="v" id="r-step"></div></div>
      <div class="cell"><div class="k">杆往哪边歪（角度）</div><div class="v" id="r-ang"></div></div>
      <div class="cell"><div class="k">杆正往哪边转（角速度）</div><div class="v" id="r-vel"></div></div>
      <div class="cell"><div class="k">这一步推哪边</div><div class="v" id="r-push"></div></div>
    </div>
    <div class="say" id="say"></div>
    <div class="legend">
      <span><i style="background:var(--push)"></i>往杆正在转的方向推：接住它，让它慢下来</span>
      <span><i style="background:var(--over)"></i>反着推：帮它转得更快（你的规则里就是“推过头”）</span>
      <span><i style="background:var(--danger)"></i>超过 12° = 倒了</span>
    </div>
    <canvas id="chart"></canvas>
    <p class="take" id="take"></p>
  </section>
</div>

  g.font = "11px " + css("--mono"); g.fillStyle = css("--muted"); g.textAlign = "center";
  for (const m of [-2.4, 0, 2.4]) g.fillText((m > 0 ? "+" : "") + m + " m", sx(m), groundY + 18);
  // 小车
  const cw = 0.5 * mpx * 1.6, ch = 22, cx = sx(x), cy = groundY - 8 - ch;
  g.fillStyle = css("--cart"); g.beginPath(); g.roundRect(cx - cw / 2, cy, cw, ch, 5); g.fill();
  g.fillStyle = css("--muted"); g.beginPath(); g.arc(cx - cw / 3, groundY - 5, 5, 0, 7); g.arc(cx + cw / 3, groundY - 5, 5, 0, 7); g.fill();
  // 杆：长 1 米，画长一点方便看
  const L = Math.min(h - 130, 1.0 * mpx * 2.2);
  const px = cx + L * Math.sin(th), py = cy - L * Math.cos(th);
  g.strokeStyle = css("--line"); g.setLineDash([4, 4]); g.lineWidth = 1;
  g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx, cy - L - 6); g.stroke(); g.setLineDash([]);
  const dead = Math.abs(deg(th)) > LIMIT;
  g.strokeStyle = dead ? css("--danger") : css("--pole"); g.lineWidth = 7; g.lineCap = "round";
  g.beginPath(); g.moveTo(cx, cy); g.lineTo(px, py); g.stroke(); g.lineCap = "butt";
  g.fillStyle = css("--fg"); g.beginPath(); g.arc(cx, cy, 4, 0, 7); g.fill();
  // 杆正往哪边转：杆顶上的弧形箭头
  if (Math.abs(om) > 0.05) {
    const r = 26, dir = om > 0 ? 1 : -1, span = Math.min(1.4, Math.abs(om) * 0.6);
    const base = -Math.PI / 2 + th;
    g.strokeStyle = css("--accent"); g.lineWidth = 2.5;
    g.beginPath(); g.arc(px, py, r, base - dir * 0.1, base + dir * span, dir < 0); g.stroke();
    const ea = base + dir * span, ex = px + r * Math.cos(ea), ey = py + r * Math.sin(ea);
    const ta = ea + dir * Math.PI / 2;
    g.fillStyle = css("--accent"); g.beginPath(); g.moveTo(ex + 7 * Math.cos(ta), ey + 7 * Math.sin(ta));
    g.lineTo(ex + 6 * Math.cos(ta + 2.3), ey + 6 * Math.sin(ta + 2.3)); g.lineTo(ex + 6 * Math.cos(ta - 2.3), ey + 6 * Math.sin(ta - 2.3)); g.closePath(); g.fill();
  }
  // 推力箭头
  const kd = kind(f);
  if (f[4] >= 0) {
    const col = kd === 1 ? css("--over") : css("--push");
    const dir = f[4] === 1 ? 1 : -1;
    const ay = cy + ch / 2;
    const start = dir > 0 ? cx - cw / 2 - 44 : cx + cw / 2 + 44;
    arrow(g, start, ay, dir > 0 ? cx - cw / 2 - 4 : cx + cw / 2 + 4, ay, col, 5);
    g.fillStyle = col; g.font = "600 13px " + css("--sans"); g.textAlign = "center";
    g.fillText(dir > 0 ? "往右推" : "往左推", start, ay - 12);
  }
  // 右侧角度表盘（放大看）
  const dx = w - dialW / 2 - 6, dy = h - 40, R = dialW / 2 - 26;
  const toA = d => -Math.PI / 2 + d / 15 * (Math.PI / 2 * 0.95);
  g.lineWidth = 10;
  g.strokeStyle = css("--danger-soft"); g.beginPath(); g.arc(dx, dy, R, toA(-15), toA(-LIMIT)); g.stroke();
  g.beginPath(); g.arc(dx, dy, R, toA(LIMIT), toA(15)); g.stroke();
  g.strokeStyle = css("--accent-soft"); g.beginPath(); g.arc(dx, dy, R, toA(-LIMIT), toA(LIMIT)); g.stroke();
  g.fillStyle = css("--muted"); g.font = "11px " + css("--mono"); g.textAlign = "center";
  for (const d of [-12, 0, 12]) {
    const a = toA(d); g.fillText((d > 0 ? "+" : "") + d + "°", dx + (R + 16) * Math.cos(a), dy + (R + 16) * Math.sin(a) + 4);
  }
  const dd = Math.max(-15, Math.min(15, deg(th))), na = toA(dd);
  g.strokeStyle = dead ? css("--danger") : css("--fg"); g.lineWidth = 3;
  g.beginPath(); g.moveTo(dx, dy); g.lineTo(dx + (R - 4) * Math.cos(na), dy + (R - 4) * Math.sin(na)); g.stroke();
  g.fillStyle = css("--fg"); g.beginPath(); g.arc(dx, dy, 4, 0, 7); g.fill();
  g.fillStyle = css("--muted"); g.font = "12px " + css("--sans");
  g.fillText("角度表（放大）", dx, dy + 22);
}
function peaks(fr) {
  const out = [];
  for (let i = 1; i < fr.length - 1; i++) {
    const a = deg(fr[i - 1][2]), b = deg(fr[i][2]), c = deg(fr[i + 1][2]);
    if ((b >= a && b > c) || (b <= a && b < c)) out.push(i);
  }
  return out;
}
function drawChart() {
  const [g, w, h] = sizeCanvas(document.getElementById("chart"));
  g.clearRect(0, 0, w, h);
  const fr = frames(), N = Math.max(fr.length - 1, 1);
  const L = 42, R = 12, T = 12, B = 26, YM = 16;
  const X = i => L + (w - L - R) * i / N;
  const Y = d => T + (h - T - B) * (YM - d) / (2 * YM);
  g.font = "11px " + css("--mono"); g.lineWidth = 1;
  for (const d of [-12, 0, 12]) {
    g.strokeStyle = d === 0 ? css("--line") : css("--danger"); g.setLineDash(d === 0 ? [] : [5, 4]);
    g.beginPath(); g.moveTo(L, Y(d)); g.lineTo(w - R, Y(d)); g.stroke(); g.setLineDash([]);
    g.fillStyle = css("--muted"); g.textAlign = "right"; g.fillText((d > 0 ? "+" : "") + d + "°", L - 6, Y(d) + 4);
  }
  g.textAlign = "center";
  const stepTick = N > 40 ? 10 : 5;
  for (let i = 0; i <= N; i += stepTick) g.fillText(i + " 步", X(i), h - 8);
  g.strokeStyle = css("--muted"); g.lineWidth = 1.5; g.beginPath();
  fr.forEach((f, i) => { const y = Y(Math.max(-YM, Math.min(YM, deg(f[2])))); if (i === 0) g.moveTo(X(i), y); else g.lineTo(X(i), y); });
  g.stroke();
  fr.forEach((f, i) => {
    const kd = kind(f);
    g.fillStyle = kd === -1 ? css("--danger") : kd === 1 ? css("--over") : css("--push");
    g.globalAlpha = i <= k ? 1 : 0.25;
    g.beginPath(); g.arc(X(i), Y(Math.max(-YM, Math.min(YM, deg(f[2])))), i === k ? 6 : 3.2, 0, 7); g.fill();
  });
  g.globalAlpha = 1;
  if (pol === "angle") {
    g.fillStyle = css("--fg"); g.font = "600 11px " + css("--mono");
    for (const i of peaks(fr)) {
      if (i > k) continue;
      const d = deg(fr[i][2]);
      g.fillText((d > 0 ? "+" : "") + d.toFixed(1) + "°", X(i), Y(d) + (d > 0 ? -10 : 18));
    }
  }
  g.strokeStyle = css("--fg"); g.globalAlpha = 0.3;
  g.beginPath(); g.moveTo(X(k), T); g.lineTo(X(k), h - B); g.stroke(); g.globalAlpha = 1;
}
function side(v) { return v > 0 ? "右" : "左"; }
function show() {
  const fr = frames(), f = fr[k], N = fr.length - 1;
  document.getElementById("slider").max = N;
  document.getElementById("slider").value = k;
  const d = deg(f[2]);
  document.getElementById("r-step").textContent = `${k} / ${N}（${(k * DT).toFixed(2)} 秒）`;
  document.getElementById("r-ang").textContent = `${d > 0 ? "+" : ""}${d.toFixed(1)}°（往${side(f[2])}歪）`;
  document.getElementById("r-vel").textContent = `${f[3] > 0 ? "+" : ""}${f[3].toFixed(2)}（往${side(f[3])}转）`;
  document.getElementById("r-push").textContent = f[4] < 0 ? "—（结束）" : (f[4] === 1 ? "往右 →" : "← 往左");
  const say = document.getElementById("say"), kd = kind(f);
  say.className = "say" + (kd === 1 ? " over" : kd === -1 ? " end" : "");
  if (kd === -1) say.textContent = `杆歪到 ${Math.abs(d).toFixed(1)}°，超过 12°，倒了。一共撑了 ${N} 步（${(N * DT).toFixed(2)} 秒）。`;
  else if (kd === 1 && f[2] * f[3] < 0 && (f[2] > 0) === (f[4] === 1)) say.textContent = `杆还往${side(f[2])}歪着，但已经在往${side(f[3])}摆回来了。你还往${side(f[2])}推，等于帮它往回甩，它会甩过中间、甩到另一边去。`;
  else if (kd === 1) say.textContent = `杆正往${side(f[3])}转，这一步却往${f[4] === 1 ? "右" : "左"}推，帮它转得更快。`;
  else say.textContent = `杆正往${side(f[3])}转，这一步往${side(f[3])}推，把杆底下往它转的方向接过去，让它慢下来。`;
  const take = document.getElementById("take");
  if (pol === "angle") {
    const ps = peaks(fr).map(i => Math.abs(deg(fr[i][2])).toFixed(1) + "°");
    take.innerHTML = `你的规则只看杆<b>在哪边</b>，不看它<b>正往哪边走</b>。橙色那几步：杆已经在往回摆了，你还往原来那边推，就把它甩过了头。所以每摆一次比上一次大（${ps.join(" → ")} → 倒），${(N * DT).toFixed(2)} 秒倒了。`;
  } else {
    take.innerHTML = `随机乱推不看杆，推对推错全凭运气，蓝橙两色混在一起，几步就倒（这一回合 ${N} 步，${(N * DT).toFixed(2)} 秒）。`;
  }
  drawScene(); drawChart();
}
function stop() { if (timer) cancelAnimationFrame(timer); timer = null; document.getElementById("play").textContent = "播放"; }
function tick(ts) {
  const ms = DT * 1000 / speed;
  if (ts - last >= ms) { last = ts; if (k < frames().length - 1) { k++; show(); } else { stop(); return; } }
  timer = requestAnimationFrame(tick);
}
document.getElementById("play").addEventListener("click", () => {
  if (timer) { stop(); return; }
  if (k >= frames().length - 1) k = 0;
  document.getElementById("play").textContent = "暂停"; last = 0; timer = requestAnimationFrame(tick);
});
document.getElementById("prev").addEventListener("click", () => { stop(); if (k > 0) { k--; show(); } });
document.getElementById("next").addEventListener("click", () => { stop(); if (k < frames().length - 1) { k++; show(); } });
document.getElementById("slider").addEventListener("input", e => { stop(); k = +e.target.value; show(); });
function setPol(p) { pol = p; stop(); k = 0;
  document.getElementById("p-angle").classList.toggle("on", p === "angle");
  document.getElementById("p-random").classList.toggle("on", p === "random"); show(); }
document.getElementById("p-angle").addEventListener("click", () => setPol("angle"));
document.getElementById("p-random").addEventListener("click", () => setPol("random"));
document.querySelectorAll(".ep").forEach(b => b.addEventListener("click", () => {
  stop(); ep = +b.dataset.ep; k = 0;
  document.querySelectorAll(".ep").forEach(x => x.classList.toggle("on", x === b)); show(); }));
document.querySelectorAll(".sp").forEach(b => b.addEventListener("click", () => {
  speed = +b.dataset.sp; document.querySelectorAll(".sp").forEach(x => x.classList.toggle("on", x === b)); }));
new ResizeObserver(() => show()).observe(document.getElementById("scene"));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", show);
k = 14;
show();
</script>
